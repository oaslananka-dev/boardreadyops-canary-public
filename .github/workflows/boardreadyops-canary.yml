name: BoardReadyOps Public Synthetic Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: boardreadyops-synthetic-canary
  cancel-in-progress: false

jobs:
  canary:
    uses: oaslananka/boardreadyops/.github/workflows/synthetic-target-repository-canary.yml@60c7bdaf7ac7d0fa2011375c59da0768d6da1c92
    with:
      visibility: public
      public-origin: ${{ vars.BOARDREADYOPS_CLOUD_ORIGIN }}
