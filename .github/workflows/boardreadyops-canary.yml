name: BoardReadyOps Public Synthetic Canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: boardreadyops-synthetic-canary
  cancel-in-progress: false

jobs:
  canary:
    uses: oaslananka/boardreadyops/.github/workflows/synthetic-target-repository-canary.yml@2eb98d899025c9d7e9589d29a1c286befe95ae6a
    with:
      visibility: public
      public-origin: ${{ vars.BOARDREADYOPS_CLOUD_ORIGIN }}
